name: Build OpenWrt H660GM-A Airtel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: git clone --depth 1 https://github.com/openwrt/openwrt.git

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target and packages
        working-directory: openwrt
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en7528=y
          CONFIG_TARGET_econet_en7528_DEVICE_dasan_h660gm-a-airtel=y

          # Web UI (HTTPS)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # Wireless Extender & Travelmate
          CONFIG_PACKAGE_relayd=y
          CONFIG_PACKAGE_luci-proto-relay=y
          CONFIG_PACKAGE_travelmate=y
          CONFIG_PACKAGE_luci-app-travelmate=y

          # USB Host & Android/iPhone Tethering
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ehci=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-ipheth=y
          CONFIG_PACKAGE_usbmuxd=y
          CONFIG_PACKAGE_libimobiledevice-utils=y
          CONFIG_PACKAGE_usbutils=y

          # USB Storage / Mini NAS
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-ksmbd=y

          # Adblock, Encrypted DNS, WireGuard, SQM, Multi-WAN
          CONFIG_PACKAGE_adblock=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_https-dns-proxy=y
          CONFIG_PACKAGE_luci-app-https-dns-proxy=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # Data Monitor, Wake-on-LAN & Tools
          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_etherwake=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          EOF
          make defconfig

      - name: Compile OpenWrt
        working-directory: openwrt
        run: make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: H660GM-A-Airtel-OpenWrt
          path: openwrt/bin/targets/econet/en7528/*tclinux.trx
